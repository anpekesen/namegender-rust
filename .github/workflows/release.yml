# crates.io release on a v* tag.
#
# crates.io allows Trusted Publishing (GitHub OIDC, no stored token) only for a
# crate that already exists. So the first version goes out with a token in the
# repository secret CARGO_REGISTRY_TOKEN (crates.io > Account Settings > API
# Tokens, scope publish-new). After that: add this repository and release.yml
# under the crate's Settings > Trusted Publishing, and DELETE the secret; every
# later release then authenticates through OIDC.
# The tag must match the version in Cargo.toml; a crates.io version cannot be
# deleted, only yanked.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
