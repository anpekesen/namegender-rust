# crates.io release on a v* tag, through Trusted Publishing (GitHub OIDC):
# no long-lived token is stored. crates.io only allows trusted publishing for a
# crate that already exists, so the very first version (0.1.0) is published
# once by hand with `cargo publish`; after that, configure this repository and
# release.yml under the crate's Settings > Trusted Publishing on crates.io.
# The tag must match the version in Cargo.toml; a crates.io version cannot be
# deleted, only yanked.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
