[package]
name = "namegender"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Client for the NameGender API: gender from names, email addresses and usernames, with the probability and sample size behind each answer."
license = "MIT"
repository = "https://github.com/anpekesen/namegender-rust"
homepage = "https://namegender.com/client-libraries"
documentation = "https://docs.rs/namegender"
readme = "README.md"
keywords = ["gender", "name", "api", "namegender"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
